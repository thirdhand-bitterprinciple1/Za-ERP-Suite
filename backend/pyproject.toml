[project]
name = "za-erp-suite"
version = "0.1.0"
description = "Modular open-source business management platform"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<6.0",
  "djangorestframework>=3.15,<4.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "python-dotenv>=1.0,<2.0",
  "drf-spectacular>=0.27,<1.0",
  "reportlab>=4.2,<5.0"
]

[tool.setuptools]
packages = ["config", "apps"]

[tool.ruff]
line-length = 100
