"area: backend":
  - changed-files:
      - any-glob-to-any-file: "backend/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file: "*.md"
      - any-glob-to-any-file: "**/*.md"

"area: github":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

"area: migrations":
  - changed-files:
      - any-glob-to-any-file: "backend/**/migrations/**"
